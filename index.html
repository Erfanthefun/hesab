<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب‌وکتاب</title>
<meta name="theme-color" content="#0B5C59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حساب‌وکتاب">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face { font-family: "Vazirmatn"; src: url("fonts/vazirmatn.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #E7ECEA; --surface: #FBFCFB; --ink: #15201E; --muted: #5B6B67; --line: #D3DBD8;
  --firouzeh: #0B6E6A; --firouzeh-deep: #0A4F4C; --on-deep: #EAF6F4; --deep-soft: #9FD0CB;
  --saffron: #C98512; --anar: #A3263C; --green: #2D7348;
  --r-lg: 24px; --r-md: 14px; --r-sm: 10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514; --surface: #172120; --ink: #E4EDEA; --muted: #92A39F; --line: #2A3735;
    --firouzeh: #45B5AD; --firouzeh-deep: #0F3F3C; --on-deep: #E4F4F1; --deep-soft: #8CC7C1;
    --saffron: #E0A43A; --anar: #E06A7D; --green: #6BC08A;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: "Vazirmatn", -apple-system, "SF Arabic", Tahoma, sans-serif; font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--firouzeh); outline-offset: 2px; }
main { max-width: 560px; margin: 0 auto; padding: 8px 18px 120px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 2px 10px; }
.top h1 { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.01em; }
.top span { color: var(--muted); font-size: .9rem; }

/* قهرمان: معادله‌ی پول آزاد */
.hero { background: var(--firouzeh-deep); color: var(--on-deep); border-radius: var(--r-lg); padding: 22px 22px 18px; }
.hero.deficit { background: #5C1726; }
.hero-label { margin: 0; font-size: .95rem; color: var(--deep-soft); }
.hero-num { margin: 2px 0 0; font-size: clamp(2.3rem, 11vw, 3.1rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero-num small { font-size: 1rem; font-weight: 500; margin-inline-start: 8px; color: var(--deep-soft); }
.hero-daily { margin: 6px 0 0; font-size: .92rem; color: var(--on-deep); opacity: .9; }
.eq { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.16); display: grid; gap: 6px; }
.eq div { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.eq dt { color: var(--deep-soft); }
.eq dt i { font-style: normal; font-size: .78rem; opacity: .8; margin-inline-start: 4px; }
.eq dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-hint { margin: 12px 0 0; font-size: .85rem; color: var(--deep-soft); }
.hero .linkbtn { color: var(--on-deep); }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
.quick button { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); font-weight: 600; font-size: .95rem; line-height: 1.35; text-align: start; }
.quick button:active { transform: scale(.98); }
.quick.big button { min-height: 76px; font-size: 1.05rem; }
.qi { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%;
  background: var(--bg); color: var(--firouzeh); font-size: 1.1rem; font-weight: 800; }

.block { margin-top: 26px; }
.block h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 10px; }
.empty, .note { color: var(--muted); font-size: .9rem; margin: 6px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--firouzeh); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

.banner .btn { flex: none; white-space: nowrap; }
.banner { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding: 12px 14px; border-radius: var(--r-md);
  background: color-mix(in srgb, var(--saffron) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--saffron) 40%, transparent); font-size: .88rem; }

.oblist, .txlist, .accs, .cards, .catbars, .inst { list-style: none; margin: 0; padding: 0; }
.ob { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ob:last-child { border-bottom: 0; }
.ob-main strong { display: block; font-weight: 700; }
.ob-main span, .ob-side em { font-size: .82rem; color: var(--muted); font-style: normal; }
.ob-side { text-align: end; }
.ob-side b { display: block; font-variant-numeric: tabular-nums; }
.ob.late .ob-side em { color: var(--anar); font-weight: 600; }
.ob .btn { grid-column: 1 / -1; justify-self: start; }

.accs li { display: grid; grid-template-columns: 1fr auto; padding: 10px 0; border-bottom: 1px solid var(--line); }
.accs li b { font-variant-numeric: tabular-nums; }
.accs li em { grid-column: 1 / -1; font-style: normal; font-size: .78rem; color: var(--muted); }
.accs.edit li { grid-template-columns: 1fr auto; gap: 8px; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px;
  border: 0; border-radius: 12px; background: var(--firouzeh); color: #fff; font-weight: 700; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: .88rem; border-radius: 10px; }
.btn.wide { width: 100%; margin-top: 12px; }
.btn.ghost { background: transparent; color: var(--firouzeh); border: 1.5px solid var(--firouzeh); }
.btn.danger { background: transparent; color: var(--anar); border: 1.5px solid var(--anar); }
.btn:active { opacity: .85; }
.btnrow { display: flex; gap: 10px; margin-top: 14px; align-items: stretch; }
.btnrow .btn.wide { margin-top: 0; }

.mswitch { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px; }
.mswitch button { width: 44px; height: 40px; border: 0; background: none; font-size: 1.4rem; color: var(--firouzeh); border-radius: 10px; }
.sums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 12px; }
.sums div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
.sums span { display: block; font-size: .8rem; color: var(--muted); }
.sums b { font-variant-numeric: tabular-nums; }
.sumbtn { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
.sumbtn span { display: block; font-size: .8rem; color: var(--muted); } .sumbtn b { font-variant-numeric: tabular-nums; }
.card.debt { border-inline-start: 4px solid var(--anar); } .card.debt.owed { border-inline-start-color: var(--green); }
.closed { margin-top: 16px; } .closed summary { color: var(--muted); font-size: .9rem; cursor: pointer; padding: 6px 0; }
.closed .card { opacity: .7; }
.subh { font-size: .95rem; margin: 22px 0 6px; }
.settles { list-style: none; margin: 0; padding: 0; }
.settles li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.settles .x { width: 28px; height: 28px; font-size: .75rem; }
.pos { color: var(--green); } .neg { color: var(--anar); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips.mini { margin-top: 8px; }
.seg .chip { white-space: nowrap; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .88rem; }
.chip.on { background: var(--firouzeh); border-color: var(--firouzeh); color: #fff; font-weight: 600; }
.chip.tag { display: inline-flex; align-items: center; gap: 6px; padding-inline-end: 6px; }
.chip.tag button { border: 0; background: var(--bg); border-radius: 50%; width: 22px; height: 22px; font-size: .7rem; line-height: 1; }
.seg { margin-bottom: 8px; }

.day h3 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 16px 0 4px; }
.txrow { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0;
  background: none; border: 0; border-bottom: 1px solid var(--line); text-align: start; }
.tx-main { display: grid; min-width: 0; }
.tx-main strong { font-weight: 600; }
.tx-main span { font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-main .meta { font-size: .76rem; }
.txrow b { white-space: nowrap; font-variant-numeric: tabular-nums; }

.fab { position: fixed; inset-inline-start: max(18px, calc(50% - 262px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--firouzeh); color: #fff; font-size: 1.9rem;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--firouzeh) 45%, transparent); }

.cards { display: grid; gap: 12px; }
.card { width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.lc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lc-top strong { font-size: 1.05rem; }
.lc-top span { color: var(--muted); font-size: .85rem; }
.bar { height: 8px; border-radius: 99px; background: var(--bg); margin: 12px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--firouzeh); border-radius: 99px; }
.lc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.lc-grid span { display: block; font-size: .78rem; color: var(--muted); }
.lc-grid b { font-weight: 600; font-variant-numeric: tabular-nums; }
.lc-end { margin: 10px 0 0; font-size: .82rem; color: var(--muted); }
.fx-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
.fx-row em { font-style: normal; font-size: .82rem; color: var(--saffron); }
.fx-row em.ok { color: var(--green); }

.catbars li { margin-bottom: 12px; }
.catbars div { display: flex; justify-content: space-between; font-size: .9rem; }
.catbars b { font-variant-numeric: tabular-nums; font-weight: 600; }
.catbars i { display: block; height: 6px; margin-top: 4px; border-radius: 99px; background: var(--firouzeh); }
.hist { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; height: 150px; align-items: end; }
.hcol { display: grid; grid-template-rows: 1fr auto; height: 100%; }
.hbars { display: flex; gap: 3px; align-items: end; justify-content: center; }
.hbars i { width: 12px; min-height: 2px; border-radius: 4px 4px 0 0; }
.inc, .k.inc { background: var(--firouzeh); } .out, .k.out { background: var(--saffron); }
.hcol span { font-size: .72rem; color: var(--muted); text-align: center; }
.legend { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.k { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-start: 8px; }
.formrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.formrow label { width: 24px; color: var(--muted); }
.formrow .datef { flex: 1; }

/* فرم‌ها */
.lbl { display: block; font-size: .84rem; color: var(--muted); margin: 14px 0 6px; }
input:not([type=checkbox]), select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
textarea { min-height: 130px; margin-top: 12px; resize: vertical; direction: rtl; }
.amtwrap { position: relative; }
.amtwrap input { font-size: 1.4rem; font-weight: 700; padding-inline-end: 70px; font-variant-numeric: tabular-nums; }
.amtwrap span { position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .9rem; }
.datef { display: grid; grid-template-columns: .8fr 1.3fr 1fr; gap: 8px; }
[data-ym].datef { grid-template-columns: 1.3fr 1fr; }
.datef .chips { grid-column: 1 / -1; }
.check { display: flex; gap: 10px; align-items: center; margin: 12px 0 0; font-size: .92rem; }
.check input { width: 20px; height: 20px; accent-color: var(--firouzeh); }
.smsinfo { margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--bg); font-size: .85rem; color: var(--muted); }
.warn { margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; font-size: .85rem; color: var(--anar); background: color-mix(in srgb, var(--anar) 10%, var(--surface)); }
.payhead strong { display: block; font-size: 1.1rem; } .payhead span { color: var(--muted); font-size: .88rem; }
.addcat { display: flex; gap: 8px; margin-top: 8px; } .addcat .btn { flex: none; min-height: 46px; }

.inst li button { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; width: 100%; gap: 8px; padding: 10px 2px;
  background: none; border: 0; border-bottom: 1px solid var(--line); text-align: start; }
.inst .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
.inst em { font-style: normal; font-size: .82rem; }
.inst li.paid button { color: var(--muted); } .inst li.paid em { color: var(--green); }
.inst li.late em { color: var(--anar); font-weight: 600; }

.help details { border-bottom: 1px solid var(--line); padding: 10px 0; }
.help summary { font-weight: 600; cursor: pointer; }
.help p { font-size: .9rem; color: var(--muted); margin: 8px 0 0; }
.help code { direction: ltr; unicode-bidi: embed; background: var(--bg); padding: 1px 6px; border-radius: 6px; font-size: .85rem; }
.ver { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 28px; }

/* ورقه‌ی پایین */
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 19, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity .2s; }
.overlay.open { opacity: 1; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 0 18px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(24px); transition: transform .22s ease-out; }
.overlay.open .sheet { transform: none; }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; justify-content: space-between; align-items: center; padding: 16px 0 8px; z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 1.15rem; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg); }

/* نوار پایین */
.tabbar { position: fixed; bottom: 0; inset-inline: 0; z-index: 40; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar div { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; }
.tabbar button { background: none; border: 0; padding: 10px 2px 8px; font-size: .74rem; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--firouzeh); font-weight: 700; }

#toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); inset-inline: 18px; margin: 0 auto; max-width: 520px; z-index: 80;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: .9rem;
  transform: translateY(-140%); transition: transform .25s; }
#toast.show { transform: none; } #toast.bad { background: var(--anar); color: #fff; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav class="tabbar" aria-label="بخش‌ها"><div>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>خانه</button>
  <button data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>تراکنش‌ها</button>
  <button data-tab="ob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>اقساط</button>
  <button data-tab="rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>گزارش</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>تنظیمات</button>
</div></nav>
<div id="toast" role="status"></div>
<script src="core.js"></script>
<script src="app.js"></script>
<script src="xlsx.full.min.js" defer></script>
</body>
</html>
